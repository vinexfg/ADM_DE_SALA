<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM de Sala &mdash; Gestão de Salas, Turmas e Horários</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/weekly.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/toast.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body>

  <div id="login-screen" class="login-screen">
    <button id="login-theme-toggle" class="theme-toggle" title="Alternar tema">🌙</button>
    <div class="login-card">
      <div class="login-logo">🏫</div>
      <h1>ADM de Sala</h1>
      <p class="subtitle">Gestão de Salas, Turmas e Horários</p>
      <form id="login-form">
        <label for="login-password">Senha de acesso</label>
        <input type="password" id="login-password" autocomplete="off" placeholder="Digite a senha" autofocus>
        <p id="login-error" class="error-msg hidden">Senha incorreta. Tente novamente.</p>
        <button type="submit" class="btn-primary btn-block">Entrar</button>
      </form>
      <p class="login-hint">Protótipo de demonstração &mdash; acesso via senha (Administração / Pedagógico)</p>
    </div>
  </div>

  <div id="app-screen" class="app-screen hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo">🏫</span>
        <span class="brand">ADM de Sala</span>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-section="dashboard"><span class="nav-icon">📊</span>Dashboard</button>
        <button class="nav-btn" data-section="salas"><span class="nav-icon">🏫</span>Salas</button>
        <button class="nav-btn" data-section="professores"><span class="nav-icon">👨‍🏫</span>Professores</button>
        <button class="nav-btn" data-section="turmas"><span class="nav-icon">🎓</span>Turmas</button>
        <button class="nav-btn" data-section="alocacao"><span class="nav-icon">🗓️</span>Alocação</button>
      </nav>
      <div class="sidebar-footer">
        <div class="role-badge" id="role-badge">Administração</div>
        <button id="export-data-btn" class="btn-ghost btn-block">⬇ Exportar dados</button>
        <button id="import-data-btn" class="btn-ghost btn-block hidden">⬆ Importar dados</button>
        <input type="file" id="import-file-input" accept="application/json" class="hidden">
        <button id="reset-data-btn" class="btn-ghost btn-block hidden">↺ Restaurar dados de exemplo</button>
        <button id="logout-btn" class="btn-secondary btn-block">Sair</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="section-title">Dashboard</h1>
        <button id="theme-toggle" class="theme-toggle" title="Alternar tema">🌙</button>
      </header>

      <div class="content">
        <section id="section-dashboard" class="section"></section>
        <section id="section-salas" class="section hidden"></section>
        <section id="section-professores" class="section hidden"></section>
        <section id="section-turmas" class="section hidden"></section>
        <section id="section-alocacao" class="section hidden"></section>
      </div>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <div class="modal-header">
        <h2 id="modal-title">Título</h2>
        <button id="modal-close" class="modal-close" title="Fechar" aria-label="Fechar">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/state.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/data-io.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/salas.js"></script>
  <script src="js/professores.js"></script>
  <script src="js/turmas.js"></script>
  <script src="js/alocacao.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
